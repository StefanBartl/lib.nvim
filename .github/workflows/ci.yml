name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PUC Lua, not "luajit-2.1": that value made the setup step fail with a
      # 404 on every run for weeks (LuaJIT stopped publishing the 2.1 tarball
      # this action downloads), so luacheck was never actually reached. Which
      # interpreter runs luacheck is independent of what it checks against —
      # `std = "luajit"` in .luacheckrc is what pins that, and it stays.
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck
      - run: luacheck lua docs/TESTS

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: nvim --headless -u NONE -l docs/TESTS/run.lua

  # The drift check docmap is built around ran nowhere automatic: the
  # pre-commit hook is opt-in per clone (`git config core.hooksPath`), so the
  # committed map went stale on main without anything noticing. `--check`
  # regenerates in memory and compares; it writes nothing.
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: nvim --headless -l scripts/gen_map.lua --check
