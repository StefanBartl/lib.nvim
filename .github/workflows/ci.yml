name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pinned, not "latest": a stylua release changed formatting behavior
          # out from under this repo once already (see .stylua.toml), and
          # nobody noticed until CI had been red on every push for weeks.
          # Bump deliberately, with `stylua --write .` run and the diff
          # reviewed, not by drifting.
          version: v2.5.2
          args: --check .

  luacheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # PUC Lua, not "luajit-2.1": that value made the setup step fail with a
      # 404 on every run for weeks (LuaJIT stopped publishing the 2.1 tarball
      # this action downloads), so luacheck was never actually reached. Which
      # interpreter runs luacheck is independent of what it checks against —
      # `std = "luajit"` in .luacheckrc is what pins that, and it stays.
      - uses: leafo/gh-actions-lua@v13
        with:
          # Explicit on purpose: v13 moved the action's own default to 5.5.
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install luacheck 1.2.0
      - run: luacheck lua TESTS

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # telemetry_wrap_spec.lua exercises lib.strategies.telemetry_wrap
      # against the real runtime-analysis.telemetry module (moved there from
      # this repo) — without this, that one spec would only ever hit its own
      # soft-`pcall` no-op branch, never the real integration.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/runtime-analysis.nvim
          path: .deps/runtime-analysis.nvim
          ref: ci-verified
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          nvim -n -i NONE --headless -u NONE -l TESTS/run.lua
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14

  # Consumers across the fleet checkout this repo as a CI dependency. Pointing
  # them at `main` directly means a broken commit here goes red in ~30 other
  # repos before anyone notices it's this repo's fault. `ci-verified` only
  # ever moves once stylua+luacheck+tests have passed, so consumers pinning
  # `ref: ci-verified` always test against a known-good commit.
  #
  # Since `tests` became a three-platform matrix, `needs: tests` waits on all
  # three -- so `ci-verified` means "green on Linux, Windows and macOS", not
  # just "green on Linux". That is deliberately stricter: this repo is the
  # cross-platform layer the rest of the fleet calls, so a macOS-only break
  # here is exactly the kind of thing consumers must not inherit silently.
  publish-ci-verified:
    name: publish ci-verified branch
    needs: [stylua, luacheck, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Never move ci-verified backwards: two pushes can finish out of order,
      # and the older run must not overwrite the newer verified commit. The
      # lookup fails closed (an API or network error stops the job instead of
      # falling through to a push) and the update carries a lease on the tip it
      # compared against.
      - name: Publish ci-verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Look the branch up on the remote instead of inferring "missing" from an API
          # error: a failed lookup must stop the job, not fall through to a push.
          tip=$(git ls-remote --heads origin refs/heads/ci-verified | cut -f1)
          if [ -z "$tip" ]; then
            # First publish. A plain push creates the branch and is rejected if a
            # concurrent run created it first.
            git push origin HEAD:refs/heads/ci-verified
            exit 0
          fi
          status=$(gh api "repos/$REPO/compare/$tip...$SHA" --jq .status)
          case "$status" in
            behind | identical)
              echo "ci-verified ($tip) is '$status' relative to $SHA (published or superseded); leaving it alone"
              ;;
            ahead | diverged)
              # The lease makes the server refuse the update if ci-verified moved since
              # the comparison, so an older run can never overwrite a newer one.
              git push origin HEAD:refs/heads/ci-verified --force-with-lease="refs/heads/ci-verified:$tip"
              ;;
            *)
              echo "::error::unexpected compare status '$status' for $tip...$SHA"
              exit 1
              ;;
          esac
